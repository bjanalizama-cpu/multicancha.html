<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Próximas Actividades — Junta de Vecinos 8•H</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #C0392B; --rojo-oscuro: #922B21; --rojo-suave: #FADBD8;
    --azul: #2E86C1; --azul-suave: #D6EAF8;
    --gris-oscuro: #1C1C1E; --gris-medio: #3A3A3C; --gris: #636366;
    --gris-claro: #AEAEB2; --borde: #E5E5EA; --fondo: #F2F2F7; --blanco: #FFFFFF;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--fondo); color:var(--gris-oscuro); min-height:100vh; }

  header { background:var(--gris-oscuro); color:white; position:sticky; top:0; z-index:100; box-shadow:0 2px 20px rgba(0,0,0,0.3); }
  .header-inner { max-width:720px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .header-left { display:flex; align-items:center; gap:14px; }
  .logo-icon { width:42px; height:42px; background:var(--azul); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
  .header-text h1 { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; color:white; line-height:1; }
  .header-text p { margin-top:2px; }
  .header-text .h-pobl { font-size:12px; font-weight:600; color:#D1D1D6; }
  .header-text .h-jjvv { font-size:10px; font-weight:300; color:var(--gris-claro); }
  .home-link { font-size:12px; color:var(--gris-claro); text-decoration:none; padding:8px 12px; border:1px solid rgba(255,255,255,0.15); border-radius:8px; transition:all 0.15s; }
  .home-link:hover { color:white; border-color:rgba(255,255,255,0.35); }

  main { max-width:720px; margin:0 auto; padding:24px 16px 40px; }

  .intro { text-align:center; margin-bottom:24px; }
  .intro h2 { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:0.5px; margin-bottom:6px; }
  .intro p { font-size:13px; color:var(--gris); }

  .evento-card { background:var(--blanco); border:1.5px solid var(--borde); border-radius:16px; padding:18px 20px; margin-bottom:14px; display:flex; gap:16px; align-items:flex-start; }
  .evento-fecha-box { flex-shrink:0; width:60px; text-align:center; background:var(--azul-suave); border-radius:12px; padding:10px 4px; }
  .evento-fecha-dia { font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; color:var(--azul); }
  .evento-fecha-mes { font-size:10px; font-weight:700; color:var(--azul); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }
  .evento-body { flex:1; min-width:0; }
  .evento-titulo { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.3px; margin-bottom:6px; line-height:1.15; }
  .evento-meta { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--gris); margin-bottom:8px; }
  .evento-meta span { display:inline-flex; align-items:center; gap:4px; }
  .evento-desc { font-size:13px; color:var(--gris-medio); line-height:1.5; white-space:pre-line; }
  .evento-fotos { display:flex; gap:6px; margin-top:10px; overflow-x:auto; }
  .evento-foto-mini { width:72px; height:72px; border-radius:8px; object-fit:cover; cursor:pointer; flex-shrink:0; transition:opacity 0.15s; }
  .evento-foto-mini:hover { opacity:0.8; }

  .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:500; align-items:center; justify-content:center; padding:24px; }
  .lightbox.visible { display:flex; }
  .lightbox img { max-width:100%; max-height:85vh; border-radius:8px; }
  .lightbox-close { position:absolute; top:20px; right:24px; color:white; font-size:32px; background:none; border:none; cursor:pointer; line-height:1; }
  .lightbox-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.1); border:none; color:white; font-size:26px; width:48px; height:48px; border-radius:50%; cursor:pointer; }
  .lightbox-prev { left:16px; } .lightbox-next { right:16px; }
  .lightbox-contador { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); color:#D1D1D6; font-size:12px; }

  .empty-state { text-align:center; padding:60px 20px; color:var(--gris-claro); }
  .empty-state .icon { font-size:48px; margin-bottom:14px; }
  .empty-state p { font-size:14px; }

  .loader-overlay { position:fixed; inset:0; background:var(--gris-oscuro); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; transition:opacity 0.4s; }
  .loader-overlay.hidden { opacity:0; pointer-events:none; }
  .loader-spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--azul); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loader-text { color:var(--gris-claro); font-size:14px; }

  footer { text-align:center; padding:20px 16px; font-size:11px; color:var(--gris-claro); border-top:1px solid var(--borde); margin-top:8px; font-weight:500; letter-spacing:0.3px; }

  @media(max-width:480px) {
    .evento-card { flex-direction:column; }
    .evento-fecha-box { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:8px; }
    .evento-fecha-dia { font-size:20px; }
  }
</style>
</head>
<body>

<div class="loader-overlay" id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Cargando actividades...</div>
</div>

<header>
  <div class="header-inner">
    <div class="header-left">
      <div class="logo-icon">📅</div>
      <div class="header-text">
        <h1>Próximas Actividades</h1>
        <p><span class="h-pobl">Población Nueva Independencia</span><span class="h-jjvv"> · Junta de Vecinos 8•H</span></p>
      </div>
    </div>
    <a href="index.html" class="home-link">← Inicio</a>
  </div>
</header>

<main>
  <div class="intro">
    <h2>Lo que viene</h2>
    <p>Actividades y eventos planificados por la directiva</p>
  </div>

  <div id="listado"></div>
</main>

<footer>© Bryan Jaña Lizama · Junta de Vecinos Unidad Vecinal N.° 8H</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose">×</button>
  <button class="lightbox-nav lightbox-prev" id="lbPrev">‹</button>
  <img id="lbImg" src="">
  <button class="lightbox-nav lightbox-next" id="lbNext">›</button>
  <div class="lightbox-contador" id="lbContador"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBYkzafSjJL43B3OVJjXwba3B5L98WybCE",
    authDomain: "multicancha-8h.firebaseapp.com",
    projectId: "multicancha-8h",
    storageBucket: "multicancha-8h.firebasestorage.app",
    messagingSenderId: "562094526883",
    appId: "1:562094526883:web:7becb711d7400f9af9ca16"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const JUNTA_ID = new URLSearchParams(location.search).get('junta') || 'nueva-independencia';

  // Propaga la junta actual a todos los enlaces internos de la página,
  // para que al navegar no se "pierda" y vuelva a la junta por defecto.
  document.querySelectorAll('a[href$=".html"]').forEach(a => {
    const href = a.getAttribute('href');
    a.setAttribute('href', href + (href.includes('?') ? '&' : '?') + 'junta=' + encodeURIComponent(JUNTA_ID));
  });

  function refProximas() { return collection(db, 'juntas', JUNTA_ID, 'proximas_actividades'); }

  const MESES = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  const MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  onSnapshot(refProximas(), (snap) => {
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const eventos = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(e => e.visible !== false)
      .filter(e => {
        if (!e.fecha) return true;
        const f = new Date(e.fecha + 'T12:00:00');
        return f >= hoy; // solo muestra las que todavía no pasaron
      })
      .sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    render(eventos);
    document.getElementById('loader').classList.add('hidden');
  }, (err) => {
    console.error(err);
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('listado').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <p>No se pudieron cargar las actividades. Intenta recargar la página.</p>
      </div>`;
  });

  function render(eventos) {
    const listado = document.getElementById('listado');
    if (eventos.length === 0) {
      listado.innerHTML = `
        <div class="empty-state">
          <div class="icon">📅</div>
          <p>Todavía no hay actividades programadas.</p>
        </div>`;
      return;
    }

    listado.innerHTML = eventos.map(e => {
      let diaNum = '', mesCorto = '';
      if (e.fecha) {
        const [a, m, d] = e.fecha.split('-').map(Number);
        if (d && m) { diaNum = d; mesCorto = MESES[m-1]; }
      }
      const metaPartes = [];
      if (e.hora) metaPartes.push(`<span>🕐 ${e.hora}</span>`);
      if (e.lugar) metaPartes.push(`<span>📍 ${e.lugar}</span>`);

      const fotos = Array.isArray(e.fotos) && e.fotos.length ? e.fotos : (e.foto ? [e.foto] : []);

      return `
        <div class="evento-card">
          <div class="evento-fecha-box">
            <div class="evento-fecha-dia">${diaNum || '—'}</div>
            <div class="evento-fecha-mes">${mesCorto || ''}</div>
          </div>
          <div class="evento-body">
            <div class="evento-titulo">${e.titulo || 'Actividad'}</div>
            ${metaPartes.length ? `<div class="evento-meta">${metaPartes.join('')}</div>` : ''}
            ${e.descripcion ? `<div class="evento-desc">${e.descripcion}</div>` : ''}
            ${fotos.length ? `
              <div class="evento-fotos" data-idx="${e.id}">
                ${fotos.map((f, i) => `<img class="evento-foto-mini" src="${f}" onclick="window._abrirLightboxEvento('${e.id}', ${i})">`).join('')}
              </div>` : ''}
          </div>
        </div>`;
    }).join('');

    // guarda las fotos de cada evento (por id) para el visor
    window._fotosPorEvento = {};
    eventos.forEach(e => {
      window._fotosPorEvento[e.id] = Array.isArray(e.fotos) && e.fotos.length ? e.fotos : (e.foto ? [e.foto] : []);
    });
  }

  let lbEventoId = null, lbIndex = 0;

  window._abrirLightboxEvento = function(eventoId, fotoIdx) {
    lbEventoId = eventoId;
    lbIndex = fotoIdx;
    mostrarFotoLightbox();
    document.getElementById('lightbox').classList.add('visible');
  };

  function mostrarFotoLightbox() {
    const fotos = window._fotosPorEvento[lbEventoId] || [];
    document.getElementById('lbImg').src = fotos[lbIndex] || '';
    const mostrarNav = fotos.length > 1;
    document.getElementById('lbPrev').style.display = mostrarNav ? 'block' : 'none';
    document.getElementById('lbNext').style.display = mostrarNav ? 'block' : 'none';
    document.getElementById('lbContador').textContent = mostrarNav ? `${lbIndex+1} / ${fotos.length}` : '';
  }

  document.getElementById('lbClose').onclick = () => document.getElementById('lightbox').classList.remove('visible');
  document.getElementById('lightbox').onclick = (e) => { if (e.target.id === 'lightbox') e.currentTarget.classList.remove('visible'); };
  document.getElementById('lbPrev').onclick = () => {
    const fotos = window._fotosPorEvento[lbEventoId] || [];
    lbIndex = (lbIndex - 1 + fotos.length) % fotos.length;
    mostrarFotoLightbox();
  };
  document.getElementById('lbNext').onclick = () => {
    const fotos = window._fotosPorEvento[lbEventoId] || [];
    lbIndex = (lbIndex + 1) % fotos.length;
    mostrarFotoLightbox();
  };
</script>
</body>
</html>
